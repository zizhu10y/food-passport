<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a1f24">
<title>美食护照 Food Passport</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="美食护照">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@chinese-fonts/lxgwwenkai@3.0.0/dist/LXGWWenKai-Medium/result.css" rel="stylesheet">
<style>
:root{
  --paper:#f4ecdc;--paper2:#ebdfc6;--paper3:#e2d3b5;
  --ink:#5b4030;--ink2:#8a6d55;--faint:#c4ad8f;
  --gold:#c9a24a;--cover:#4a1f24;--red:#b5483b;
  --tw:'Special Elite','American Typewriter','Courier New',monospace;
  --hd:'LXGW WenKai Medium','Kaiti SC','STKaiti','KaiTi',serif;
  --bd:'Songti SC','STSong','Noto Serif SC','PingFang SC',serif;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .24  0 0 0 0 .14  0 0 0 .11 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#d9cbb0 var(--noise);color:var(--ink);font-family:var(--bd);font-size:15px;line-height:1.6;min-height:100vh}
button{font:inherit;color:inherit}
a{color:inherit}
.tw{font-family:var(--tw)}
.page{max-width:620px;margin:0 auto;min-height:100vh;background:var(--paper) var(--noise);padding:18px 16px 110px;box-shadow:0 0 0 1px #cdbb9a,0 10px 40px rgba(60,40,20,.18);position:relative;overflow-x:hidden}
.page::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0,rgba(255,250,235,.55),transparent 60%),radial-gradient(ellipse at 50% 120%,rgba(170,130,80,.12),transparent 60%)}
.page>*{position:relative}
h1,h2,h3{font-family:var(--hd);font-weight:400;margin:0}
.small{font-size:12px;letter-spacing:.12em;color:var(--ink2)}
.muted{color:var(--ink2)}
.poem{font-family:var(--tw);color:var(--ink2);font-size:14px;margin:6px 0 0}
hr.dash{border:0;border-top:1.5px dashed var(--faint);margin:22px 0}

/* ---------- cover ---------- */
.cover{min-height:100vh;display:grid;place-items:center;padding:24px;background:#2a1215}
.book{width:min(360px,88vw);aspect-ratio:5/7;border-radius:10px 16px 16px 10px;position:relative;color:#d9b660;
  background:
   repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
   repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px),
   radial-gradient(ellipse at 30% 20%,#64303a,transparent 70%),var(--cover);
  box-shadow:inset 10px 0 18px rgba(0,0,0,.35),inset -2px 0 0 rgba(255,255,255,.06),0 20px 50px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:40px 24px 30px;text-align:center}
.book::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:2px;background:rgba(0,0,0,.25);box-shadow:1px 0 0 rgba(255,255,255,.05)}
.foil{background:linear-gradient(100deg,#b8913e 0%,#f3dc96 35%,#c99a43 55%,#f0d488 75%,#a9832f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.book h1{font-size:44px;letter-spacing:.2em;line-height:1.2}
.book .en{font-family:var(--tw);letter-spacing:.35em;font-size:15px;margin-top:4px}
.book .rep{font-family:var(--tw);letter-spacing:.25em;font-size:11px;opacity:.85}
.emblem{width:118px;height:118px}
.book .cnt{font-family:var(--tw);font-size:11px;letter-spacing:.15em;opacity:.7;margin-top:10px}
/* Opens by itself: the book rises in, the foil catches the light, then the cover swings open */
.cover{cursor:pointer}
.cover .book{animation:rise .35s ease-out both}
.cover .foil{background-size:220% 100%;animation:shine .5s .15s ease-in-out both}
.cover.leaving{animation:tolight .45s .3s ease-in forwards}
.cover.leaving .book{animation:flip .75s ease-in-out forwards;transform-origin:left center}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
@keyframes flip{to{transform:perspective(900px) rotateY(-100deg);opacity:0}}
@keyframes tolight{to{background:var(--paper)}}
@media (prefers-reduced-motion:reduce){.cover .book,.cover .foil{animation:none}}

/* ---------- headers ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.topbar a{text-decoration:none;font-family:var(--tw);font-size:13px;border-bottom:1px dashed var(--faint)}
.hd{text-align:center;padding:8px 0 4px}
.hd h1{font-size:34px;letter-spacing:.15em}
.sum{margin-top:10px;font-size:14px}
.sum b{font-family:var(--tw);font-size:17px}
.rg{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px;color:var(--ink2)}
.rg::after{content:"";flex:1;border-top:1.5px dashed var(--faint)}

/* ---------- country cards ---------- */
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ccard{display:block;text-decoration:none;background:rgba(255,252,243,.55);border:1px solid #dccbab;border-left:5px solid var(--c);border-radius:6px;padding:10px 12px;position:relative;overflow:hidden;transition:transform .15s}
.ccard:active{transform:scale(.98)}
.ccard .fl{font-size:24px;line-height:1}
.ccard .nm{font-family:var(--hd);font-size:19px;margin-top:4px}
.ccard .en{font-family:var(--tw);font-size:10.5px;letter-spacing:.14em;color:var(--ink2)}
.ccard .pg{font-family:var(--tw);font-size:13px;margin-top:4px}
.bar{height:5px;background:var(--paper3);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--c,var(--ink));border-radius:3px;opacity:.75}
.ccard .ghost{position:absolute;right:-14px;bottom:-16px;width:66px;opacity:.5;transform:rotate(-14deg)}
.ccard.special{--c:#6d5a8a}

/* ---------- country page ---------- */
.chd{text-align:center;padding:4px 0 6px}
.chd .fl{font-size:40px;line-height:1}
.chd h1{font-size:34px;letter-spacing:.12em;margin-top:4px}
.chd .en{font-family:var(--tw);letter-spacing:.3em;font-size:12px;color:var(--ink2)}
.chd .prog{font-family:var(--tw);margin-top:10px}
.chd .prog b{font-size:22px;color:var(--c)}
.chd .bar{max-width:240px;margin:6px auto 0}
.syd{display:inline-block;margin-top:10px;font-size:13px;background:rgba(255,252,243,.6);border:1px dashed var(--faint);border-radius:6px;padding:4px 10px}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media(min-width:520px){.dgrid{grid-template-columns:repeat(3,1fr)}}
.dish{display:block;width:100%;text-align:left;background:rgba(255,252,243,.5);border:1px solid #dccbab;border-radius:8px;padding:8px 8px 10px;position:relative;cursor:pointer;transition:transform .15s,box-shadow .15s}
.dish:hover{box-shadow:0 4px 14px rgba(90,60,30,.12)}
.dish:active{transform:scale(.98)}
.dish .iw{aspect-ratio:6/5;display:grid;place-items:center;overflow:hidden;border-radius:4px}
.dish .iw img{width:100%;height:100%;object-fit:cover;border-radius:3px}
.dish .dn{font-family:var(--hd);font-size:16px;margin-top:4px;line-height:1.3}
.dish .de{font-family:var(--tw);font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dish.locked .dn{color:var(--ink2)}
.dish.locked .iw{background:repeating-linear-gradient(0deg,transparent 0 13px,rgba(150,120,80,.07) 13px 14px)}
.dish .ms{position:absolute;top:2px;right:2px;width:46px;pointer-events:none}
.dish .cnt{position:absolute;bottom:8px;right:8px;font-family:var(--tw);font-size:11px;color:var(--ink2)}
.dish .ic{font-size:11px;opacity:.8}
.dish.challenge{outline:2px dashed var(--red);outline-offset:2px}

/* ---------- illustration ---------- */
.ill{width:100%;height:auto;display:block;overflow:visible}
.ill .ln{stroke:#4e2c1f;stroke-width:.85;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ill.hi .ln{stroke-width:1.5}.ill.hi .ln.thin{stroke-width:.7}
/* Not tasted yet: the same painting under a pale, washed-out filter; stamping it brings the full colour in */
.locked .ill,.ill.locked{filter:saturate(.45) brightness(1.18) contrast(.72);opacity:.62}
.locked .ill .ln,.ill.locked .ln{stroke:#8a6d55}
.ill .rv{stroke-dasharray:1 1;stroke-dashoffset:0}
.anim .ill .rv{animation:paint 2.2s ease-in-out .35s both}
.anim .ill .ln{animation:inkin .8s ease both}
@keyframes paint{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes inkin{from{stroke:var(--faint);opacity:.6}to{opacity:1}}

/* ---------- visa / stamps ---------- */
.visa{margin-top:26px;border-top:1.5px dashed var(--faint);padding-top:14px}
.visa h3{font-size:17px;text-align:center}
.visa .vsub{text-align:center;font-family:var(--tw);font-size:11px;letter-spacing:.2em;color:var(--ink2)}
.stamps{display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;margin-top:10px;min-height:90px;background:repeating-linear-gradient(0deg,transparent 0 27px,rgba(150,120,80,.08) 27px 28px);border-radius:6px;padding:8px}
.stamps .st{width:96px;mix-blend-mode:multiply;cursor:pointer}
.empty{text-align:center;color:var(--ink2);font-family:var(--tw);font-size:13px;padding:24px 8px}
.stamp{display:block;width:100%;height:auto;overflow:visible}

/* ---------- tags ---------- */
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--t,#e7dcc4);border:1px solid rgba(91,64,48,.18)}
.chip{font-size:13px;padding:4px 11px;border-radius:999px;border:1.3px solid var(--faint);background:transparent;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.no.on{background:#a8493d;border-color:#a8493d}

/* ---------- buttons/forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:8px 18px;cursor:pointer;font-size:15px;text-decoration:none}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff8ee}
.btn.sm{font-size:13px;padding:4px 12px}
.btn:active{transform:scale(.97)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:block;margin-top:10px;font-size:13px;color:var(--ink2)}
.inp,select.inp,textarea.inp{width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,252,243,.75);border:1px solid #d4c19f;border-bottom:2px solid var(--ink2);border-radius:4px;padding:7px 9px;margin-top:3px}
textarea.inp{font-family:var(--tw);font-size:12px;min-height:110px}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:4px}
.seg button{flex:1;border:0;background:transparent;padding:7px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.ctabs{margin:22px 0 12px}.ctabs button{font-size:14px;padding:8px 4px;white-space:nowrap}.ctabs+div>.shops{margin-top:0;border-top:0;padding-top:0}.ctabs+div>.shops h3{display:none}.ctabs+div>.shops .vsub{text-align:center}.ctabs small{opacity:.7;font-size:12px;margin-left:2px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:480px){.two{grid-template-columns:minmax(0,1fr);gap:0}}
/* iOS Safari gives date inputs a fixed intrinsic width that overflows grid cells */
.inp{display:block;min-width:0;max-width:100%}
input[type=date].inp{-webkit-appearance:none;appearance:none;min-height:42px;line-height:1.3}
input[type=date].inp::-webkit-date-and-time-value{text-align:left}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(40,25,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fade .2s}
.modal[hidden]{display:none}
.sheet{background:var(--paper) var(--noise);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 18px 28px;position:relative;animation:up .25s ease}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:12px}}
/* sticky so the × stays reachable after scrolling a long sheet; negative bottom margin keeps it out of the layout */
.sheet .x{position:sticky;top:-8px;z-index:5;display:block;margin:-12px -8px -36px auto;width:36px;height:36px;border:0;border-radius:50%;background:rgba(244,236,220,.92);box-shadow:0 2px 8px rgba(60,35,20,.18);font-size:24px;cursor:pointer;color:var(--ink2);line-height:1;padding:0}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.dm-ill{max-width:280px;margin:0 auto;position:relative}
.dm-ill img{width:100%;border-radius:6px;box-shadow:0 2px 10px rgba(80,50,20,.18)}
/* untasted dishes: full-colour preview in the detail sheet; the country card stays a silhouette until stamped */
.dm h2{font-size:28px;text-align:center;margin-top:6px}
.dm .en{text-align:center;font-family:var(--tw);color:var(--ink2)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin-top:14px;font-size:14px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0}
.fact{margin-top:14px;padding:10px 12px;border-left:3px solid var(--gold);background:rgba(201,162,74,.08);font-size:14px}
.recs{list-style:none;padding:0;margin:10px 0 0}
.recs li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--faint);font-size:13.5px}
.recs li .s{width:46px;flex:none}
.recs li .t{flex:1}
.recs li button{border:0;background:none;color:var(--ink2);cursor:pointer;font-size:12px}
.preview{margin-top:8px;max-width:220px}
.preview img{width:100%;border-radius:6px}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.nav[hidden]{display:none}
.nav div{pointer-events:auto;max-width:620px;width:100%;display:flex;background:rgba(236,224,200,.96);backdrop-filter:blur(6px);border-top:1.5px solid #cdb995;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;text-align:center;text-decoration:none;font-size:12px;padding:4px 0;border-radius:8px;color:var(--ink2)}
.nav a span{display:block;font-size:20px;line-height:1.2}
.nav a.on{color:var(--ink);background:rgba(91,64,48,.08);font-weight:600}
.totop{position:fixed;right:max(14px,calc(50% - 296px));bottom:calc(80px + env(safe-area-inset-bottom));z-index:21;width:46px;height:46px;border-radius:50%;background:rgba(255,252,243,.96);border:1.5px solid #cdb995;color:var(--ink);font-size:20px;line-height:1;box-shadow:0 4px 14px rgba(60,35,20,.22);cursor:pointer;opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;transition:opacity .2s,transform .2s}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop.low{bottom:calc(18px + env(safe-area-inset-bottom))}

/* ---------- challenge ---------- */
.panel{background:rgba(255,252,243,.55);border:1px solid #dccbab;border-radius:10px;padding:14px;margin-top:14px}
.panel h3{font-size:16px;margin-bottom:6px}
.draw{text-align:center}
.draw .card{max-width:320px;margin:14px auto 0;padding:14px;border:1.5px dashed var(--ink2);border-radius:12px;background:rgba(255,252,243,.7)}
.draw .card[data-act]{cursor:pointer;transition:transform .12s}.draw .card[data-act]:active{transform:scale(.985)}
.draw .card.flipin{animation:flipin .45s ease}
/* 2D only: Safari sometimes skips painting SVG filters inside a 3D-rotated layer */
@keyframes flipin{from{transform:scaleX(.05) scale(.9);opacity:.2}}
.banner{display:flex;gap:10px;align-items:center;background:rgba(181,72,59,.08);border:1.5px dashed var(--red);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:14px}
.banner .t{flex:1}

/* ---------- search ---------- */
.res{list-style:none;padding:0;margin:10px 0 0}
.res li{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px dashed var(--faint);cursor:pointer;border-radius:6px}
.res li:hover{background:rgba(255,252,243,.6)}
.res .th{width:56px;flex:none}
.res .t{flex:1}
.res .t b{font-family:var(--hd);font-weight:400;font-size:17px}

/* ---------- stats ---------- */
.bigline{font-family:var(--tw);font-size:20px;text-align:center;line-height:1.6;margin:18px 0 6px}
.bigline b{font-size:30px;color:var(--red)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{text-align:center;background:rgba(255,252,243,.55);border:1px solid #dccbab;border-radius:8px;padding:10px 4px}
.stat b{display:block;font-family:var(--tw);font-size:22px}
.stat span{font-size:12px;color:var(--ink2)}
.ach{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--faint)}
.ach .ic{font-size:26px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:2px dashed var(--faint);filter:grayscale(1);opacity:.55;flex:none}
.ach.done .ic{filter:none;opacity:1;border:2px solid var(--gold);background:rgba(201,162,74,.12)}
.ach .t{flex:1}
.ach .t b{font-family:var(--hd);font-weight:400;font-size:16px}
.ach .t div{font-size:12.5px;color:var(--ink2)}
.ach .n{font-family:var(--tw);font-size:13px}
table.ct{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.ct td{padding:5px 4px;border-bottom:1px dashed var(--faint)}
table.ct td:last-child,table.ct td:nth-child(2){text-align:right;font-family:var(--tw)}

/* ---------- fx ---------- */
.fx{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50}
.fx .big{width:min(64vw,260px);animation:drop .5s cubic-bezier(.3,1.5,.5,1) both;mix-blend-mode:multiply}
.fx .dong{position:absolute;font-family:var(--hd);font-size:34px;color:var(--red);animation:dong .9s ease .3s both;transform:translate(90px,-110px)}
.fx.out{animation:fxout .5s ease forwards}
@keyframes drop{0%{transform:scale(2.6) rotate(var(--r));opacity:0}55%{transform:scale(.9) rotate(var(--r));opacity:1}100%{transform:scale(1) rotate(var(--r));opacity:1}}
@keyframes dong{0%{opacity:0;transform:translate(90px,-90px) scale(.6)}40%{opacity:1;transform:translate(90px,-115px) scale(1.1)}100%{opacity:0;transform:translate(90px,-130px)}}
@keyframes fxout{to{opacity:0}}
.thud{animation:thud .35s ease .22s}
@keyframes thud{25%{transform:translate(2px,3px)}50%{transform:translate(-2px,-1px)}75%{transform:translate(1px,1px)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .25s ease;max-width:90vw;text-align:center}
.shops{margin-top:26px;border-top:1.5px dashed var(--faint);padding-top:14px}
.shops h3{font-size:17px;text-align:center}
.shops.short .x,.shops:not(.short) .more{display:none}
.shop{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px dashed var(--faint);font-size:14px}
.shop .r{flex:none;width:52px;text-align:center;font-family:var(--tw)}
.shop .r b{display:block;font-size:18px;color:var(--c,var(--ink))}
.shop .r span{font-size:10.5px;color:var(--ink2)}
.shop .t{flex:1;min-width:0}
.shop .t b{font-family:var(--hd);font-weight:400;font-size:16px}
.shop .t .a{font-size:12.5px;color:var(--ink2)}
.shop .t .n{font-size:12.5px;margin-top:2px}
.shop .t .tags{margin-top:4px}
.shop a.map{flex:none;font-size:12px;text-decoration:none;border:1px solid var(--faint);border-radius:999px;padding:2px 9px;margin-top:3px}
.shop .warn{color:#a8493d}
.armed{color:#a8493d !important;border-color:#a8493d !important;font-weight:600}

/* Account sync: on claude.ai each viewer's stamps live in a private db subtree (data/users/<id>),
   one document per stamp plus a "meta" doc. The local file has no window.claude and stays localStorage-only. */
let REMOTE=null,syncState='local';
const syncErr=()=>{syncState='error';toast('同步失败：这次的改动先存在这台设备上')};
const remote={
  put:r=>REMOTE?REMOTE.doc('r_'+r.id).set(r).catch(syncErr):null,
  del:id=>REMOTE?REMOTE.doc('r_'+id).delete().catch(syncErr):null,
  meta:()=>REMOTE?REMOTE.doc('meta').set({challenge:S.challenge||null,challengesDone:S.challengesDone||0,chFrom:S.chFrom||null,chDue:S.chDue||null,chLog:S.chLog||[]}).catch(syncErr):null,
};
async function initSync(){
  try{
    if(!window.claude?.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const uid=db&&user?await user.id():null;
    if(!uid)return;
    const col=db.collection('data/users/'+uid);let first=true;
    col.onSnapshot(async snap=>{
      if(first){first=false;REMOTE=col;syncState='synced';
        if(snap.empty&&S.records.length){ // first visit on this account: upload what this browser already has
          for(const [k,r] of S.records.entries()){if(!r.t)r.t=k;await REMOTE.doc('r_'+r.id).set(r).catch(syncErr)}
          await remote.meta();return}}
      const recs=[];let meta=null;
      for(const d of snap.docs){const v=d.data();if(d.id==='meta')meta=v;else if(d.id.startsWith('r_')&&v)recs.push({...v})}
      recs.sort((a,b)=>(a.t||0)-(b.t||0));
      const next={records:recs,challenge:meta?.challenge??null,challengesDone:meta?.challengesDone||0,chFrom:meta?.chFrom??null,chDue:meta?.chDue??null,chLog:meta?.chLog||[]};
      if(JSON.stringify(next)===JSON.stringify(S))return;
      S=next;save();if(modal.hidden)route(true);
    },()=>{REMOTE=null;syncState='error'});
  }catch(e){}
}

function topShapes(type,x,y,col,a){
  x=Math.round(x);y=Math.round(y);const t=rot(a,x,y);
  switch(type){
    case'slice':return[[E(x,y,8,3.4,t),col],[E(x+.6,y-.3,5.6,2,t),'#f6e2d8','nl'],[P(`M${x-5} ${y} q3 -2 6 0 t5 0`,t),'none','thin'],[E(x-3,y-1.5,1.6,.6,t),'#fff','hl']];
    case'wedge':return[[P(`M${x-9} ${y+3} Q${x} ${y-7} ${x+9} ${y+3}Z`,t),col],[P(`M${x-6} ${y+2} Q${x} ${y-4} ${x+6} ${y+2}`,t),'none','thin']];
    case'leaf':return[[P(`M${x-6} ${y} Q${x} ${y-6} ${x+6} ${y} Q${x} ${y+5} ${x-6} ${y}Z`,t),col],[P(`M${x-5} ${y} L${x+5} ${y} M${x-1} ${y} l2 -2 M${x+2} ${y} l2 2`,t),'none','thin']];
    case'dot':return[[C(x,y,2.4),col],[C(x-.8,y-.8,.6),'#fff','hl']];
    case'pea':return[[C(x,y,3.6),col],[C(x-1.2,y-1.2,.9),'#fff','hl']];

    case'ring':return[[C(x,y,4.6),col],[C(x,y,2),'none'],[C(x,y,3.3),'none','thin']];

/* ---------- China ---------- */
// broth / sauce surface inside a bowl: base wash plus clipped colour pools and extra markup
const aBroth=(cx,cy,rx,ry,base,deep,light,extra='')=>[[aE(cx,cy,rx,ry),base,'nl'],
  aClip(ellD(cx,cy,rx,ry),`<g filter="url(#wc2)"><ellipse cx="${cx+rx*.35}" cy="${cy+ry*.5}" rx="${rx*.9}" ry="${ry*.6}" fill="${deep}" opacity=".6"/><ellipse cx="${cx-rx*.45}" cy="${cy-ry*.3}" rx="${rx*.45}" ry="${ry*.35}" fill="${light}" opacity=".6"/></g>`+extra)];
// tangle of noodles as raw markup
const aNoods=(list,col='#f6e3a0',dark='#c98d3c',w=3)=>list.map(([x,y,n,s,h])=>`<path d="${aWave(x,y+1,n,s,h)}" fill="none" stroke="${dark}" stroke-width="${w+1.4}" opacity=".55"/><path d="${aWave(x,y,n,s,h)}" fill="none" stroke="${col}" stroke-width="${w}"/><path d="${aWave(x,y-.8,n,s,h)}" fill="none" stroke="#fffbea" stroke-width=".7" opacity=".8"/><path d="${aWave(x,y+w*.55,n,s,h)}" fill="none" stroke="#5a3424" stroke-width=".45"/>`).join('');
// loose tangle of flat ribbon noodles: long curves at varied angles instead of a regular mesh
const aRibbons=(r,n,x0,y0,w,h,col,dark,wd=3.2)=>Array.from({length:n},()=>{const x=x0+r()*w*.3,y=y0+r()*h,x2=x0+w*.7+r()*w*.3,y2=y0+r()*h,c1x=x0+r()*w,c1y=y0-10+r()*(h+20),c2x=x0+r()*w,c2y=y0-10+r()*(h+20);
  const d=`M${x.toFixed(1)} ${y.toFixed(1)} C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  return`<path d="${d}" fill="none" stroke="${dark}" stroke-width="${wd+1.4}" stroke-linecap="round" opacity=".6"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${wd}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fffbea" stroke-width=".7" opacity=".7" transform="translate(-.6 -.8)"/>`}).join('');
const aDrops=(r,n,cx,cy,rx,ry,c='#b56a2a')=>Array.from({length:n},()=>{const t=r()*Math.PI*2,q=Math.sqrt(r()),x=cx+Math.cos(t)*q*rx,y=cy+Math.sin(t)*q*ry,s=.7+r()*1.8;
  return`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${s.toFixed(1)}" fill="none" stroke="${c}" stroke-width=".5" opacity=".8"/><circle cx="${(x-s*.35).toFixed(1)}" cy="${(y-s*.35).toFixed(1)}" r="${(s*.3).toFixed(1)}" fill="#fff8e4"/>`}).join('');
// bamboo steamer seen from above at 3/4, returns items; contents go on top
function aSteamer(cx,cy,rx,ry,h=24){
  return[[aP(`M${cx-rx} ${cy} L${cx-rx} ${cy+h} A${rx} ${ry} 0 0 0 ${cx+rx} ${cy+h} L${cx+rx} ${cy}`),'#d9b06a',''],
    aClip(`M${cx-rx} ${cy} L${cx-rx} ${cy+h} A${rx} ${ry} 0 0 0 ${cx+rx} ${cy+h} L${cx+rx} ${cy} A${rx} ${ry} 0 0 1 ${cx-rx} ${cy}Z`,
      `<path d="${Array.from({length:Math.round(rx/5)},(_,i)=>{const x=cx-rx+6+i*10;return`M${x} ${cy} v${h+ry}`}).join(' ')}" stroke="#9a7238" stroke-width=".6" fill="none" opacity=".8"/><path d="M${cx-rx} ${cy+h*.5} A${rx} ${ry} 0 0 0 ${cx+rx} ${cy+h*.5}" stroke="#9a7238" stroke-width="1" fill="none"/>`),
    aWash(aP(`M${cx+rx*.3} ${cy+ry+h-2} A${rx} ${ry} 0 0 0 ${cx+rx} ${cy+h} L${cx+rx} ${cy} Q${cx+rx*.8} ${cy+ry+h*.5} ${cx+rx*.3} ${cy+ry+h-2}Z`),'#a8763a',.55),

let illN=0;
function ill(d,extra=''){
  if(ART[d.id])return artSVG(ARTC[d.id]||(ARTC[d.id]=ART[d.id]()),extra);
  const [m,s,a,b]=d.cols.split(',').map(v=>!v||v==='-'?null:(K[v]||v));
  const c={m,s,a,b};const T=TPL[d.tpl](c);const rnd=seeded(d.id);
  const an=T.an||[];const tops=[];
  const tl=d.tops?d.tops.split(',').flatMap(t=>{const[tp,col]=t.split(':');const[type,n]=tp.split('*');return Array(+n||1).fill([type,K[col]||col])}):[];
  tl.forEach(([type,col],i)=>{if(!an.length)return;const[x,y]=an[i%an.length];const j=i>=an.length?6:1.5;tops.push(...topShapes(type,x+(rnd()-.5)*j*2,y+(rnd()-.5)*j,col,(rnd()-.5)*70))});
  const fr=T.fr||[];const all=[...T.sh,...tops,...fr];
  // one watercolour pass per big shape (with hue shifts + gloss), one shared pass for all small toppings
  const big=([el,f,fl])=>{
    if(!f||f==='none'||fl==='hl'||fl==='thin')return'';
    if(fl==='st'||fl==='sn')return`<g filter="url(#wc)">${el} fill="none" stroke="${deep(f)}" stroke-width="3.4" stroke-linecap="round"/></g>`;
    if(!/^#/.test(f))return`${el} fill="${f}"/>`;
    if(isLight(f))return`<g filter="url(#wc)">${el} fill="${f}"/></g>`;
    return`<g filter="url(#wc)">${el} fill="${deep(f)}"/>${el} fill="${hsl(f,22,1.5,-.18)}" mask="url(#shm)" opacity=".75"/>${el} fill="${hsl(f,-16,1.35,.03)}" mask="url(#lit)" opacity=".55"/></g>`+(fl==='nl'?'':`${el} fill="url(#gl)"/>`);
  };
  const small=list=>{const f=list.filter(([,f,fl])=>f&&f!=='none'&&fl!=='hl'&&fl!=='thin').map(([el,f,fl])=>fl==='st'||fl==='sn'?`${el} fill="none" stroke="${deep(f)}" stroke-width="2.6" stroke-linecap="round"/>`:`${el} fill="${deep(f)}"/>`).join('');return f?`<g filter="url(#wc)">${f}</g>`:''};
  const gloss=all.filter(([,,fl])=>fl==='hl').map(([el,f])=>`${el} fill="${f}"/>`).join('');
  const [sx,sy,srx,sry]=SHD[d.tpl]||[62,88,44,5];
  const colG=`<ellipse cx="${sx}" cy="${sy}" rx="${srx}" ry="${sry}" fill="#9aa6e6" opacity=".45" filter="url(#wc)"/>`+
    T.sh.map(big).join('')+vesselDetail(d.tpl,c)+small(tops)+fr.map(big).join('')+gloss;
  const lnG=all.filter(s=>s[2]!=='nl'&&s[2]!=='sn'&&s[2]!=='hl'&&s[2]!=='thin').map(([el])=>`${el} fill="none"/>`).join('');
  const thinG=all.filter(s=>s[2]==='thin').map(([el])=>`${el} fill="none"/>`).join('');
  const id='mk'+(++illN);
  return `<svg class="ill ${extra}" viewBox="0 0 120 100" aria-hidden="true"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-10" y="-10" width="140" height="120"><path class="rv" pathLength="1" d="${MASK}" stroke="#fff" stroke-width="24" fill="none"/></mask></defs><g class="col" mask="url(#${id})">${colG}</g><g class="ln" filter="url(#line)">${lnG}<g class="thin" stroke-width=".4">${thinG}</g></g></svg>`;
}

function poly(n,r,deg){const p=[];for(let i=0;i<n;i++){const t=(deg+i*360/n)*Math.PI/180;p.push((50+r*Math.cos(t)).toFixed(1)+','+(50+r*Math.sin(t)).toFixed(1))}return p.join(' ')}
function frame(shape,ink,dashed){
  const s=`stroke="${ink}" fill="none"`;
  switch(shape){
    case'oval':return`<ellipse cx="50" cy="50" rx="48" ry="38" ${s} stroke-width="3.2"/><ellipse cx="50" cy="50" rx="42" ry="32" ${s} stroke-width="1.1"/>`;
    case'rect':return`<rect x="4" y="13" width="92" height="74" rx="5" ${s} stroke-width="3.2"/><rect x="9" y="18" width="82" height="64" rx="2" ${s} stroke-width="1.1"/>`;
    case'hex':return`<polygon points="${poly(6,48,0)}" ${s} stroke-width="3.2"/><polygon points="${poly(6,42,0)}" ${s} stroke-width="1.1"/>`;
    case'octa':return`<polygon points="${poly(8,47,22.5)}" ${s} stroke-width="3.2"/><polygon points="${poly(8,41,22.5)}" ${s} stroke-width="1.1"/>`;
    case'cog':return`<circle cx="50" cy="50" r="45" ${s} stroke-width="6" stroke-dasharray="4 3"/><circle cx="50" cy="50" r="38" ${s} stroke-width="1.1"/>`;
    default:return`<circle cx="50" cy="50" r="46" ${s} stroke-width="3.2"${dashed?' stroke-dasharray="7 4"':''}/><circle cx="50" cy="50" r="40" ${s} stroke-width="1.1"/>`;
  }
}
const short=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};

/* =====================================================================
   PHOTO → colored-pencil sketch (all local, in canvas)
   ===================================================================== */
async function toSketch(file){
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});
  const MAX=380,sc=Math.min(1,MAX/Math.max(img.width,img.height));
  const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');
  x.drawImage(img,0,0,w,h);URL.revokeObjectURL(img.src);
  const id=x.getImageData(0,0,w,h),p=id.data,N=w*h;
  const g=new Float32Array(N);for(let i=0;i<N;i++)g[i]=.299*p[i*4]+.587*p[i*4+1]+.114*p[i*4+2];
  const bl=new Float32Array(N);// 3x3 blur to calm noise
  for(let yy=1;yy<h-1;yy++)for(let xx=1;xx<w-1;xx++){let s=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)s+=g[(yy+dy)*w+xx+dx];bl[yy*w+xx]=s/9}
  const mag=new Float32Array(N);let sum=0;
  for(let yy=1;yy<h-1;yy++)for(let xx=1;xx<w-1;xx++){const i=yy*w+xx;
    const gx=-bl[i-w-1]-2*bl[i-1]-bl[i+w-1]+bl[i-w+1]+2*bl[i+1]+bl[i+w+1];
    const gy=-bl[i-w-1]-2*bl[i-w]-bl[i-w+1]+bl[i+w-1]+2*bl[i+w]+bl[i+w+1];
    mag[i]=Math.hypot(gx,gy);sum+=mag[i]}
  const thr=(sum/N)*1.9+6;const PA=[244,236,220],INK=[91,64,48];
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const i=yy*w+xx,k=i*4;
    let r=p[k],gg=p[k+1],b=p[k+2];const l=.299*r+.587*gg+.114*b;
    r=l+(r-l)*.6;gg=l+(gg-l)*.6;b=l+(b-l)*.6;                       // soften saturation
    r=r*.62+PA[0]*.38;gg=gg*.62+PA[1]*.38;b=b*.62+PA[2]*.38;        // pastel toward paper
    const edge=Math.min(xx,yy,w-1-xx,h-1-yy);
    let cov=(.68+Math.random()*.38)*Math.min(1,(edge-6-Math.random()*14)/16); // grainy, unfinished edges
    cov=Math.max(0,Math.min(1,cov));
    r=PA[0]+(r-PA[0])*cov;gg=PA[1]+(gg-PA[1])*cov;b=PA[2]+(b-PA[2])*cov;
    if(mag[i]>thr&&edge>4){const t=Math.min(1,(mag[i]-thr)/thr*1.3)*.85*(.7+Math.random()*.3);
      r=r*(1-t)+INK[0]*t;gg=gg*(1-t)+INK[1]*t;b=b*(1-t)+INK[2]*t}
    p[k]=r;p[k+1]=gg;p[k+2]=b}
  x.putImageData(id,0,0);
  return cv.toDataURL('image/jpeg',.8);
}

// ---- search / identify ----
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[\s'’\-·.]/g,'');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
const CJK=/[㐀-鿿]/;
function score(q,key){
  if(!key)return 0;if(key===q)return 100;
  if(key.includes(q))return 85-Math.min(20,(key.length-q.length));
  if(q.includes(key)&&key.length>=2)return 40+30*key.length/q.length;
  if(CJK.test(q)){const ks=new Set(key);let hit=0;for(const ch of new Set(q))if(ks.has(ch))hit++;return hit?hit/Math.max(new Set(q).size,ks.size)*65:0}
  let d=lev(q,key);// also slide a window over longer keys so "chiken rice" finds "hainanese chicken rice"
  for(let i=0;i+q.length<=key.length;i++)d=Math.min(d,lev(q,key.slice(i,i+q.length)));
  const sim=1-d/Math.max(q.length,3);return sim>0.45?sim*70:0;
}
function search(qs){
  const q=norm(qs);if(!q)return[];
  return DISHES.map(d=>{const keys=[d.zh,d.en,...d.alias.split(' ')].map(norm);return{d,s:Math.max(...keys.map(k=>score(q,k)))}})
    .filter(x=>x.s>=40).sort((a,b)=>b.s-a.s).slice(0,8);
}
let lastQ='';
function resultsHTML(q){
  const rs=search(q);
  if(!q.trim())return`<p class="muted" style="font-size:13px;margin-top:10px">试试：叻沙、冬阴功、烤肉卷、pho、tacco、chiken rice……</p>`;
  if(!rs.length)return`<div class="empty">词典里没找到「${esc(q)}」<br>可以盖个混血章或神秘章 ↓</div>`;
  return `<ul class="res">${rs.map(({d})=>`<li data-act="dish" data-id="${d.id}"><div class="th ${unlocked(d.id)?'':'locked'}">${ill(d)}</div><div class="t"><b>${esc(d.zh)}</b> <span class="tw muted" style="font-size:12px">${esc(d.en)}</span><br><span style="font-size:12.5px">${CMAP[d.c].flag} ${CMAP[d.c].zh} · ${d.fl.join(' ')}</span></div>${unlocked(d.id)?'<span class="tw small">✓</span>':''}</li>`).join('')}</ul>`;
}

    <dt>主要食材</dt><dd>${esc(d.ing)}</dd>

    ${c.syd?`<dt>悉尼</dt><dd>📍 ${c.syd.map(esc).join(' · ')}</dd>`:''}
   </dl>
   <div class="fact">💡 ${esc(d.fact)}</div>
   ${PICKS[id]?`<h3 style="margin-top:18px;font-size:16px">📍 推荐去这家吃</h3>${shopRow([...PICKS[id].slice(0,4),'',PICKS[id][4]])}`:''}
   ${shopsForDish(id).filter(s=>!PICKS[id]||s[0]!==PICKS[id][0]).length?`<p class="muted" style="font-size:13px;margin:10px 0 0">附近还有</p>${shopsForDish(id).filter(s=>!PICKS[id]||s[0]!==PICKS[id][0]).map(s=>shopRow(s)).join('')}`:''}
   ${S.challenge===id?`<div class="banner"><span>⚔️</span><div class="t">这是你当前的挑战！</div></div>`:''}
   <div class="row" style="justify-content:center;margin-top:16px"><button class="btn pri" data-act="stamp" data-id="${id}">🖋️ ${u?'再盖一个章':'吃到了！盖章'}</button></div>
   ${rs.length?`<h3 style="margin-top:20px;font-size:16px">盖章记录 · ${rs.length}</h3><ul class="recs">${rs.slice().reverse().map(recLi).join('')}</ul>`:''}
  </div>`);
}
const recLine=r=>[r.date,r.price!=null&&r.price!==''?money(r.price):'',r.place,r.note].filter(Boolean).map(esc).join(' · ');
const recLi=r=>`<li><div class="s">${stampSVG(r)}</div><div class="t">${recLine(r)}${r.type==='home'?' 🏠':''}${r.cheapNew?' <span class="goldbadge">穷鬼美食家</span>':''}</div><button data-act="delrec" data-id="${r.id}">删除</button></li>`;

let pendingPhoto=null,stampCtx=null;
function placeList(cids){
  const all=[...new Set(COUNTRIES.flatMap(c=>c.syd||[]))];
  const pref=[...(stampCtx?.dishId&&PICKS[stampCtx.dishId]?[PICKS[stampCtx.dishId][0]]:[]),...cids.flatMap(c=>[...countryShops(c).map(e=>e.s[0]),...(CMAP[c]?.syd||[])])];
  return `<datalist id="places">${[...new Set([...pref,...all])].map(p=>`<option value="${esc(p)}">`).join('')}</datalist>`;
}
function openStamp(ctx){
  stampCtx=ctx;pendingPhoto=null;
  let head='',cids=[];
  if(ctx.kind==='dish'){const d=DMAP[ctx.dishId];cids=[d.c];head=`<h2 style="text-align:center;font-size:24px">${CMAP[d.c].flag} ${esc(d.zh)}</h2><div class="tw muted" style="text-align:center">${esc(d.en)}</div>`}
  else if(ctx.kind==='fusion'){head=`<h2 style="text-align:center;font-size:24px">🧬 混血章</h2>
    <label class="f">菜名</label><input class="inp" name="name" required placeholder="例：韩式炸鸡汉堡">
    <div class="two"><div><label class="f">国家 A</label><select class="inp" name="ca">${COUNTRIES.map(c=>`<option value="${c.id}">${c.flag} ${c.zh}</option>`).join('')}</select></div>
    <div><label class="f">国家 B</label><select class="inp" name="cb">${COUNTRIES.map((c,i)=>`<option value="${c.id}" ${i===1?'selected':''}>${c.flag} ${c.zh}</option>`).join('')}</select></div></div>`}
  else head=`<h2 style="text-align:center;font-size:24px">❓ 神秘章</h2><label class="f">你怎么叫它？</label><input class="inp" name="name" required placeholder="例：夜市那个绿色的饼">`;
  openModal(`<form id="stampForm">${head}
    <div class="two"><div><label class="f">日期</label><input class="inp" type="date" name="date" value="${today()}" required></div>
    <div><label class="f">花了多少（$）</label><input class="inp" type="number" name="price" min="0" step="0.5" inputmode="decimal" placeholder="8"></div></div>
    <label class="f">印章类型</label>
    <div class="seg" id="seg"><button type="button" class="on" data-t="out">🍽️ 外食章</button><button type="button" data-t="home">🏠 家厨章</button></div>
    <label class="f">在哪吃的</label><input class="inp" name="place" list="places" placeholder="例：Cabramatta / 我家厨房">${placeList(cids)}
    <label class="f">一句评价</label><input class="inp" name="note" maxlength="60" placeholder="例：汤头好到想喝完">
    <label class="f">拍张照？会在本地变成彩铅插画（可选）</label>
    <input class="inp" type="file" accept="image/*" id="photo">
    <div class="preview" id="pv"></div>
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn pri" type="submit" style="font-size:17px;padding:10px 30px">咚！盖章</button></div>
  </form>`);
  $('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('#seg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  $('#photo').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;$('#pv').innerHTML='<span class="tw muted">削铅笔中…</span>';
    try{pendingPhoto=await toSketch(f);$('#pv').innerHTML=`<img src="${pendingPhoto}" alt="">`}catch(err){$('#pv').innerHTML='<span class="muted">这张图读不出来，换一张试试。</span>'}});
}
function submitStamp(form){
  const fd=new FormData(form);const before=achDone();
  const type=$('#seg .on').dataset.t;
  const priceRaw=fd.get('price');const price=priceRaw===''?null:Math.max(0,Number(priceRaw));
  const r={id:uid(),t:Date.now(),kind:stampCtx.kind,date:fd.get('date')||today(),price,place:(fd.get('place')||'').trim(),note:(fd.get('note')||'').trim(),type,
    rot:Math.round((Math.random()-.5)*34),dx:Math.round((Math.random()-.5)*10),dy:Math.round((Math.random()-.5)*12),seed:Math.floor(Math.random()*1000)};
  let first=false,goto='#/c/X';
  if(r.kind==='dish'){r.dishId=stampCtx.dishId;first=!unlocked(r.dishId);goto='#/c/'+DMAP[r.dishId].c;
    if(S.challenge===r.dishId){r.challenge=true;var chBak={challenge:S.challenge,chFrom:S.chFrom,chDue:S.chDue,chLog:S.chLog};endChallenge('win');S.challengesDone=(S.challengesDone||0)+1}}
  else{r.name=(fd.get('name')||'').trim()||'无名之味';first=true;
    if(r.kind==='fusion'){r.countries=[fd.get('ca'),fd.get('cb')];if(r.countries[0]===r.countries[1]){toast('混血章要选两个不同的国家哦');return}}}
  if(price!=null&&price<=10&&first)r.cheapNew=true;
  if(pendingPhoto)r.photo=pendingPhoto;
  S.records.push(r);
  if(!save()){S.records.pop();if(r.challenge){Object.assign(S,chBak);S.challengesDone--}return}
  remote.put(r);if(r.challenge)remote.meta();
  closeModal();
  stampFX(r,()=>{
    pendingAnim=first&&r.kind==='dish'&&!r.photo?r.dishId:null;
    if(location.hash===goto)route();else location.hash=goto;
    const after=achDone();ACH.filter(a=>after.has(a.id)&&!before.has(a.id)).forEach((a,i)=>setTimeout(()=>toast(`🏅 成就解锁：${a.name}`),400+i*2800));
    if(r.cheapNew)setTimeout(()=>toast('🪙 $10 以内吃到新菜！金色徽章 +1'),200);
    if(r.challenge){const c=chStats();setTimeout(()=>toast(c.cur>1?`⚔️ 挑战完成！${c.cur} 连胜 🔥`:'⚔️ 挑战完成！'),100)}
  });
}
function stampFX(r,done){
  const fx=document.createElement('div');fx.className='fx';fx.style.setProperty('--r',r.rot+'deg');
  fx.innerHTML=`<div class="big">${stampSVG(r)}</div><div class="dong">咚！</div>`;document.body.appendChild(fx);
  app.classList.remove('thud');void app.offsetWidth;app.classList.add('thud');
  try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
  setTimeout(()=>{fx.classList.add('out');done()},1100);setTimeout(()=>fx.remove(),1650);
}
function openRec(id){
  const r=S.records.find(x=>x.id===id);if(!r)return;
  if(r.kind==='dish')return openDish(r.dishId);
  openModal(`<div style="max-width:180px;margin:0 auto">${stampSVG(r)}</div>
   <h2 style="text-align:center;font-size:24px;margin-top:6px">${esc(r.name)}</h2>
   <p style="text-align:center" class="muted">${r.kind==='fusion'?r.countries.map(c=>CMAP[c].flag+' '+CMAP[c].zh).join(' × '):'❓ 未知国籍'}</p>
   ${r.photo?`<div class="dm-ill"><img src="${r.photo}" alt=""></div>`:''}
   <p style="text-align:center">${recLine(r)}</p>
   ${r.kind==='mystery'?`<div class="panel"><h3>查到是什么了？</h3><input class="inp" id="rq" placeholder="搜菜名" value="${esc(r.name)}"><div id="rres"></div></div>`:''}
   <div class="row" style="justify-content:center;margin-top:14px"><button class="btn sm" data-act="delrec" data-id="${r.id}">删除这个章</button></div>`);
  if(r.kind==='mystery'){const upd=()=>{const rs=search($('#rq').value);$('#rres').innerHTML=rs.length?`<ul class="res">${rs.map(({d})=>`<li data-act="reclass" data-id="${r.id}" data-d="${d.id}"><div class="th">${ill(d)}</div><div class="t"><b>${esc(d.zh)}</b><br><span style="font-size:12.5px">${CMAP[d.c].flag} ${CMAP[d.c].zh}</span></div><span class="btn sm">归类</span></li>`).join('')}</ul>`:'<p class="muted" style="font-size:13px">没有匹配的菜。</p>'};
    $('#rq').addEventListener('input',upd);upd()}
}

/* =====================================================================
   ROUTER + ACTIONS
   ===================================================================== */
let pendingAnim=null;
// The cover plays its opening animation on its own; tapping it just skips ahead.
// replace() keeps the cover out of history, so Back doesn't land on it and re-open.
function openCover(){const c=$('#cover');if(!c||c.classList.contains('leaving'))return;
  c.classList.add('leaving');setTimeout(()=>{if(!location.hash)location.replace('#/')},750)}
function route(keep){
  checkExpired();
  const h=location.hash.replace(/^#/,'');const nav=$('#nav');let key='index',html;
  if(!h){html=vCover();key=null;setTimeout(openCover,600)}
  else if(h.startsWith('/c/')){html=vCountry(h.slice(3));key='index'}
  else if(h==='/challenge'){html=vChallenge();key='challenge'}
  else if(h==='/find'){html=vFind();key='find'}
  else if(h==='/stats'){html=vStats();key='stats'}
  else html=vIndex();
  app.innerHTML=html;nav.hidden=!key;
  nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.nav===key));
  if(!keep)window.scrollTo(0,0);
  syncTop();
  if(key==='find'){const q=$('#q');q.addEventListener('input',()=>{lastQ=q.value;$('#qres').innerHTML=resultsHTML(q.value)})}
  if(pendingAnim){const card=$('#card-'+pendingAnim);pendingAnim=null;
    if(card){card.classList.add('anim');card.scrollIntoView({block:'center',behavior:'smooth'})}}
}
// Floating back-to-top: appears once you've scrolled a screen or so down
function syncTop(){const b=$('#totop');b.classList.toggle('show',scrollY>innerHeight*.8);b.classList.toggle('low',$('#nav').hidden)}
addEventListener('scroll',syncTop,{passive:true});
$('#totop').addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
// Tapping the tab you're already on also jumps back to the top
$('#nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.getAttribute('href')==='#'+location.hash.replace(/^#/,'')){e.preventDefault();scrollTo({top:0,behavior:'smooth'})}});
// In-page "tap again to confirm": browser confirm() dialogs are silently blocked in some viewers
function armed(t,label){
  if(t.dataset.armed==='1')return true;
  const old=t.innerHTML;t.dataset.armed='1';t.textContent=label;t.classList.add('armed');
  setTimeout(()=>{if(t.isConnected&&t.dataset.armed==='1'){t.dataset.armed='';t.innerHTML=old;t.classList.remove('armed')}},3500);
  return false;
}
const ACT={
  open:openCover,
  close:()=>closeModal(),
  dish:t=>openDish(t.dataset.id),
  stamp:t=>openStamp({kind:'dish',dishId:t.dataset.id}),
  fusion:()=>openStamp({kind:'fusion'}),
  mystery:()=>openStamp({kind:'mystery'}),
  rec:t=>openRec(t.dataset.id),
  delrec:t=>{if(!armed(t,'再点一次确认删除'))return;S.records=S.records.filter(r=>r.id!==t.dataset.id);save();remote.del(t.dataset.id);closeModal();route();toast('已删除这个章')},
  reclass:t=>{const r=S.records.find(x=>x.id===t.dataset.id);r.kind='dish';r.dishId=t.dataset.d;save();remote.put(r);closeModal();toast(`❓ → ${DMAP[r.dishId].zh}，已归类`);location.hash='#/c/'+DMAP[r.dishId].c},
  want:t=>{const v=t.dataset.v;CF.want=!v?[]:CF.want.includes(v)?CF.want.filter(x=>x!==v):[...CF.want,v];if(v)CF.no=CF.no.filter(x=>x!==v);refreshFilters()},
  no:t=>{const v=t.dataset.v;CF.no=CF.no.includes(v)?CF.no.filter(x=>x!==v):[...CF.no,v];CF.want=CF.want.filter(x=>x!==v);refreshFilters()},
  kind:t=>{CF.kind=t.dataset.v;refreshFilters()},
  cfb:t=>{CF[t.dataset.v]=!CF[t.dataset.v];refreshFilters()},
  draw:()=>{const p=pool();if(!p.length){CF.cur=null;$('#drawbox').innerHTML=drawHTML(p,null);return}
    const opts=p.length>1?p.filter(d=>d.id!==CF.cur):p;CF.cur=opts[Math.floor(Math.random()*opts.length)].id;
    $('#drawbox').innerHTML=drawHTML(p,DMAP[CF.cur]);
    $('#drawcard').scrollIntoView({block:'nearest',behavior:'smooth'})},
  accept:t=>{if(S.challenge&&S.challenge!==t.dataset.id&&!armed(t,`再点一次：放弃「${DMAP[S.challenge].zh}」`))return;
    endChallenge('quit');S.challenge=t.dataset.id;S.chFrom=today();S.chDue=dueDate(CF.due);save();remote.meta();
    toast(S.chDue?`⚔️ 挑战已接受！${S.chDue===today()?'今天':S.chDue.slice(5).replace('-','/')+' 前'}吃到就算赢`:'⚔️ 挑战已接受！吃到之后记得盖章');route(true)},
  quit:t=>{if(!armed(t,'确认放弃'))return;endChallenge('quit');save();remote.meta();toast('已放弃。没关系，换一道再来！');route(true)},
  ctab:t=>{ctab=t.dataset.v;t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));
    $('#ctabbox').innerHTML=ctabBody(ctabC)},
  moreshops:t=>{t.closest('.shops').classList.remove('short')},
  due:t=>{CF.due=t.dataset.v;t.parentNode.querySelectorAll('[data-act=due]').forEach(b=>b.classList.toggle('on',b===t))},
  export:()=>{$('#bk').innerHTML=`<textarea class="inp" id="bkt" readonly>${esc(JSON.stringify(S))}</textarea><div class="row" style="margin-top:6px"><button class="btn sm" data-act="copy">复制</button></div>`;$('#bkt').select()},
  copy:()=>{const t=$('#bkt');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('已复制'),()=>{document.execCommand('copy');toast('已复制')})},
  download:async()=>{const dl=window.claude?.use?await claude.use('downloads'):null;
    if(dl){try{await dl.save({filename:`food-passport-${today()}.json`,data:JSON.stringify(S)})}catch(e){}return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`food-passport-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},
  importOpen:()=>{$('#bk').innerHTML=`<textarea class="inp" id="bki" placeholder="把导出的文本粘贴到这里"></textarea><div class="row" style="margin-top:6px"><input type="file" accept=".json,application/json" id="bkf" style="font-size:13px"><button class="btn sm pri" data-act="doImport">导入（覆盖当前记录）</button></div>`;
    $('#bkf').addEventListener('change',async e=>{const f=e.target.files[0];if(f)$('#bki').value=await f.text()})},
  doImport:t=>{try{const s=JSON.parse($('#bki').value);if(!s||!Array.isArray(s.records))throw 0;
    s.records=s.records.filter(r=>r&&r.id&&(r.kind!=='dish'||DMAP[r.dishId])&&(r.kind!=='fusion'||(Array.isArray(r.countries)&&r.countries.every(c=>CMAP[c]))));
    if(!armed(t,`再点一次：用 ${s.records.length} 个章覆盖现在的 ${S.records.length} 个`))return;
    const old=S.records.map(r=>r.id);S=Object.assign(BLANK(),s);S.records.forEach((r,k)=>{if(!r.t)r.t=k});save();toast('导入成功');route();
    if(REMOTE)(async()=>{for(const id of old)await remote.del(id);for(const r of S.records)await remote.put(r);await remote.meta()})()}catch(e){toast('格式不对，导入失败')}},
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){f(t,e)}});
document.addEventListener('change',e=>{if(e.target.dataset.cf){CF[e.target.dataset.cf]=e.target.value;refreshFilters()}});
document.addEventListener('submit',e=>{if(e.target.id==='stampForm'){e.preventDefault();submitStamp(e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal()});
window.addEventListener('hashchange',()=>{closeModal();route()});
route();
initSync();

// Offline service worker. When a new version takes over, reload once so the new drawings show right away.
if('serviceWorker' in navigator){
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded){reloaded=true;location.reload()}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(reg=>{reg.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update()})}).catch(()=>{}));
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
